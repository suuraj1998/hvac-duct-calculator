<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10B981">
  <title>Get HVAC Duct Sizing &amp; Airflow Calculator</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #0F1216; color: #E2E8F0; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 20px; }
    a.btn, button.btn { display: block; margin: 12px 0; padding: 14px; border-radius: 10px; border: 0;
      background: #171B21; color: #E2E8F0; font-size: 16px; text-decoration: none; cursor: pointer;
      outline: 1px solid #2A323D; width: 100%; box-sizing: border-box; }
    .primary { background: #10B981 !important; color: #003822 !important; font-weight: bold; }
  </style>
</head>
<body>
<main>
  <img src="icons/Icon-192.png" alt="App icon">
  <h1>HVAC Duct Calculator</h1>
  <p>Install on any device.</p>
  <a class="btn primary" href="./">Open Web App</a>
  <button class="btn primary" id="installBtn" hidden>Install Desktop / Web App (PWA)</button>
  <!-- Replace each href with the live store listing URL after publishing. -->
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.hvac.ductsizing.calculator">Google Play</a>
  <a class="btn" href="https://galaxystore.samsung.com/detail/com.hvac.ductsizing.calculator">Samsung Galaxy Store</a>
  <a class="btn" href="https://www.amazon.com/gp/mas/dl/android?p=com.hvac.ductsizing.calculator">Amazon Appstore</a>
  <a class="btn" href="privacy.html">Privacy Policy</a>
</main>
<script>
  let deferredPrompt;
  const btn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    btn.hidden = false;
  });
  btn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    btn.hidden = true;
  });
</script>
</body>
</html>
