<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1216"/>
      <stop offset="100%" stop-color="#171B21"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="94" fill="none" stroke="#2A323D" stroke-width="8"/>

  <!-- Outer Duct Circle Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#06B6D4" stroke-width="12" stroke-dasharray="16 12" opacity="0.8"/>

  <!-- Inner Rectangular Duct Cross Section -->
  <rect x="136" y="156" width="240" height="200" rx="20" fill="#064E3B" fill-opacity="0.4" stroke="url(#primaryGrad)" stroke-width="16" filter="url(#glow)"/>

  <!-- Airflow Velocity Lines -->
  <path d="M 180 220 L 280 220 M 180 256 L 330 256 M 180 292 L 250 292" stroke="#6EE7B7" stroke-width="10" stroke-linecap="round"/>

  <!-- Airflow Arrow Head -->
  <path d="M 320 236 L 350 256 L 320 276 Z" fill="#6EE7B7"/>

  <!-- Dimension Indicator Rules -->
  <path d="M 136 120 L 376 120 M 136 110 L 136 130 M 376 110 L 376 130" stroke="#94A3B8" stroke-width="4"/>
  <path d="M 90 156 L 90 356 M 80 156 L 100 156 M 80 356 L 100 356" stroke="#94A3B8" stroke-width="4"/>

  <!-- Badge Label Text -->
  <text x="256" y="425" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="2">HVAC DUCT</text>
</svg>
